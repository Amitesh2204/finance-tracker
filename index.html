<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Finance Tracker</title>
  <link rel="manifest" href="frontend/manifest.json">
  <link rel="stylesheet" href="frontend/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/pouchdb@7.3.1/dist/pouchdb.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <img src="frontend/assets/logo.svg" alt="logo" />
        <h1>Wealty</h1>
      </div>
      <nav class="main-menu">
        <a href="frontend/pages/budget/budget.html"><span class="icon">📊</span> Budget</a>
        <a href="frontend/pages/expense/expense.html"><span class="icon">💸</span> Expense</a>
        <a href="frontend/pages/investments/investments.html"><span class="icon">💹</span> Investments</a>
        <a href="frontend/pages/reports/report.html"><span class="icon">📑</span> Report</a>
      </nav>
      <!-- Footer pinned to bottom -->
      <div class="sidebar-footer">
        <a href="frontend/pages/settings.html"><span class="icon">⚙️</span> Settings</a>
        <a href="frontend/pages/login.html"><span class="icon">🚪</span> Logout</a>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <header class="topbar">
        <h2>Financial Statistics</h2>
        <div class="topbar-right">
          <input class="search" placeholder="Search" />
          <button class="icon">🔔</button>
          <img class="avatar" src="frontend/assets/avatar.svg" alt="avatar" />
        </div>
      </header>

      <section class="content">
        <!-- Summary cards -->
        <div class="cards">
          <div class="card balance">
            <h3>Balance</h3>
            <p id="totalBalance">$0.00</p>
          </div>
          <div class="card savings">
            <h3>Savings</h3>
            <p id="savings">$0.00</p>
          </div>
          <div class="card expenses">
            <h3>Expenses</h3>
            <p id="expenses">$0.00</p>
          </div>
        </div>

        <!-- Statistics + Last Transaction side by side -->
        <div class="stats-row">
          <div class="chart card">
            <h3>Financial Statistics</h3>
            <canvas id="financeChart"></canvas>
          </div>
          <div class="transactions card large">
            <h3>Last Transaction</h3>
            <table id="lastTx"></table>
          </div>
        </div>

        <!-- Recent Activities -->
        <div class="chart card">
          <h3>Recent Activities (Last Month)</h3>
          <canvas id="recentActivityChart"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script>
    window.__API_BASE__ = window.__API_BASE__ || '/';
    window.__REMOTE_COUCH__ = window.__REMOTE_COUCH__ || null;
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service worker registered', reg.scope))
          .catch(err => console.warn('Service worker registration failed', err));
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="frontend/charts.js"></script>
  <script src="frontend/app.js"></script>
  <script src="frontend/app.js"></script>
</body>
</html>
