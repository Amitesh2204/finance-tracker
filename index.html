<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Finance Tracker</title>
  <link rel="manifest" href="frontend/manifest.json">
  <link rel="stylesheet" href="frontend/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/pouchdb@7.3.1/dist/pouchdb.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="frontend/assets/logo.svg" alt="logo" />
        <h1>Wealty</h1>
      </div>
      <nav>
        <a href="frontend/pages/budget/budget.html">Budget</a>
        <a href="frontend/pages/expense/expense.html">Expense</a>
        <a href="frontend/pages/investments/investments.html">Investments</a>
        <a href="frontend/pages/reports/report.html">Report</a>
      </nav>
      <div class="sidebar-footer">
        <button class="contact">Contact us</button>
        <a href="#" class="logout">Log out</a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2>Overview</h2>
        <div class="topbar-right">
          <input class="search" placeholder="Search" />
          <button class="icon">🔔</button>
          <img class="avatar" src="frontend/assets/avatar.svg" alt="avatar" />
        </div>
      </header>

      <section class="content layout-split">
        <div class="left">
          <div class="cards">
            <div class="card">
              <h3>Total Balance</h3>
              <p id="totalBalance">$11,716.77 <span class="positive">+4%</span></p>
            </div>
            <div class="card">
              <h3>Main Account</h3>
              <p id="mainAccount">$3,252.13</p>
            </div>
            <div class="card">
              <h3>Savings</h3>
              <p id="savings">$4,000.00 <span class="positive">+10%</span></p>
            </div>
          </div>

          <div class="chart card">
            <canvas id="balanceChart"></canvas>
          </div>

          <div class="transactions card">
            <h3>Recent Transactions</h3>
            <table id="recentTx">
            </table>
          </div>
        </div>

        <aside class="right">
          <div class="summary card">
            <h4>Total Balance</h4>
            <div class="amount">$11,716.77 <span class="positive">+4%</span></div>
          </div>
          <div class="summary card">
            <h4>Investments</h4>
            <div class="amount">$4,436.64 <span class="positive">+27.24%</span></div>
          </div>
          <div class="summary card">
            <h4>Savings</h4>
            <div class="amount">$4,000.00 <span class="positive">+10%</span></div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script>
    // Override these values when the frontend and backend are hosted separately.
    window.__API_BASE__ = window.__API_BASE__ || '/';
    window.__REMOTE_COUCH__ = window.__REMOTE_COUCH__ || null;
    // For GitHub Pages or remote backend, uncomment and set your tunnel URL(es):
    // window.__API_BASE__ = 'https://hosts-pmid-violin-walter.trycloudflare.com/';
    // window.__REMOTE_COUCH__ = 'https://hosts-pmid-violin-walter.trycloudflare.com/finance';

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service worker registered', reg.scope))
          .catch(err => console.warn('Service worker registration failed', err));
      });
    }
  </script>
  <script src="frontend/app.js"></script>
</body>
</html>
