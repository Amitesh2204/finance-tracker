<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Finance Tracker</title>
  <link rel="manifest" href="frontend/manifest.json">
  <link rel="stylesheet" href="frontend/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/pouchdb@7.3.1/dist/pouchdb.min.js"></script>

  <style>
    /* small local styles to make Last Transaction scrollable and layout for activity/savings charts */
    .tx-scroll {
      max-height: 260px;
      overflow-y: auto;
      border-top: 1px solid rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .tx-scroll table { width:100%; border-collapse:collapse; }
    .tx-scroll td { padding:10px 12px; border-bottom:1px solid #2b2b2b; }
    .activity-row { display:flex; gap:20px; align-items:flex-start; margin-top:18px; flex-wrap:wrap; }
    .activity-card { flex:1 1 320px; min-height:260px; background:var(--card-bg); padding:16px; border-radius:12px; }
    .activity-card h4 { margin:0 0 8px; color:#ecf0f1; font-weight:700; }
    .selector-inline { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
    .selector-inline label { color:#ecf0f1; font-weight:600; }
    /* small login badge in topbar when logged in */
    .user-badge { display:flex; gap:8px; align-items:center; padding:6px 10px; background:rgba(255,255,255,0.03); border-radius:999px; color:#ecf0f1; }
    .user-badge .name { font-weight:600; font-size:0.95rem; }
    .logout-link { color:#ecf0f1; text-decoration:none; padding:6px 8px; border-radius:6px; background:rgba(255,255,255,0.03); }

    /* Collapsible section styles */
    .collapsible {
      border-radius: 12px;
      background: var(--card-bg);
      margin-bottom: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .collapsible-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 16px;
      cursor:pointer;
      user-select:none;
      background: linear-gradient(0deg, rgba(255,255,255,0.01), rgba(255,255,255,0.01));
    }
    .collapsible-header .title { font-weight:700; color:#ecf0f1; }
    .collapsible-header .controls { display:flex; gap:8px; align-items:center; margin-left:auto; }
    .collapsible-header .chev { font-size:0.95rem; color:var(--muted); }
    .collapsible-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 320ms ease;
      padding: 0 16px;
    }
    .collapsible.open .collapsible-content {
      padding: 12px 16px 18px 16px;
      max-height: 1200px; /* large enough to show charts/tables */
    }

    /* Make collapsible headers more compact on mobile */
    @media (max-width: 600px) {
      .collapsible-header { padding:10px 12px; }
      .collapsible-content { padding: 0 12px; }
      .collapsible.open .collapsible-content { padding: 10px 12px 14px 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <img src="frontend/assets/logo.svg" alt="logo" />
        <h1>Wealty</h1>
      </div>
      <nav class="main-menu">
        <a href="frontend/pages/budget/budget.html"><span class="icon">📊</span> Budget</a>
        <a href="frontend/pages/expense/expense.html"><span class="icon">💸</span> Expense</a>
        <a href="frontend/pages/investments/investments.html"><span class="icon">💹</span> Investments</a>
        <a href="frontend/pages/reports/report.html"><span class="icon">📑</span> Report</a>
      </nav>
      <div class="sidebar-footer">
        <a href="frontend/pages/settings.html"><span class="icon">⚙️</span> Settings</a>
        <a id="sidebarLogout" href="frontend/pages/logout.html"><span class="icon">🚪</span> Logout</a>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <header class="topbar">
        <h2>Financial Statistics</h2>
        <div class="topbar-right" id="topbarRight">
          <input class="search" placeholder="Search" />
          <button class="icon">🔔</button>
          <img class="avatar" src="frontend/assets/avatar.svg" alt="avatar" />
        </div>
      </header>

      <section class="content">
        <!-- Summary cards -->
        <div class="cards">
          <div class="card balance">
            <h3>Balance</h3>
            <p id="totalBalance">₹0.00</p>
          </div>
          <div class="card savings">
            <h3>Savings</h3>
            <p id="savings">₹0.00</p>
          </div>
          <div class="card expenses">
            <h3>Expenses</h3>
            <p id="expenses">₹0.00</p>
          </div>
        </div>

        <!-- Collapsible: Financial Statistics -->
        <div class="collapsible" id="financeSection" data-default-open="true">
          <div class="collapsible-header" role="button" aria-expanded="true" tabindex="0">
            <div class="title">Financial Statistics</div>
            <div class="controls">
              <label for="chartYear" style="font-weight:600; color:#ecf0f1; font-size:0.95rem; margin-right:8px;">Year</label>
              <select id="chartYear" style="padding:6px 8px; border-radius:6px; background:#1e1e1e; color:#ecf0f1; border:1px solid #333;"></select>
              <div class="chev">▲</div>
            </div>
          </div>
          <div class="collapsible-content">
            <div class="chart card same-size" style="background:transparent; box-shadow:none; padding:0;">
              <div style="height:320px;">
                <canvas id="financeChart"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- Collapsible: Last Transaction -->
        <div class="collapsible" id="lastTxSection" data-default-open="false">
          <div class="collapsible-header" role="button" aria-expanded="false" tabindex="0">
            <div class="title">Last Transaction</div>
            <div class="controls">
              <label for="lastTxDate" style="font-weight:600; color:#ecf0f1; font-size:0.95rem; margin-right:8px;">Date</label>
              <input id="lastTxDate" type="date" style="padding:6px 8px; border-radius:6px; background:#1e1e1e; color:#ecf0f1; border:1px solid #333;" />
              <div class="chev">▼</div>
            </div>
          </div>
          <div class="collapsible-content">
            <div class="transactions card large same-size" style="background:transparent; box-shadow:none; padding:0;">
              <div class="tx-scroll" style="margin-top:8px;">
                <table id="lastTx"></table>
              </div>
            </div>
          </div>
        </div>

        <!-- Recent Activities and Savings charts side by side -->
        <div class="activity-row">
          <div class="activity-card">
            <div class="selector-inline">
              <h4 style="margin:0">Recent Activities (Monthly Expense)</h4>
              <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
                <label for="activityYear">Year</label>
                <select id="activityYear" style="padding:6px 8px; border-radius:6px; background:#1e1e1e; color:#ecf0f1; border:1px solid #333;"></select>
              </div>
            </div>
            <div id="monthlyExpenseTotal" style="color:#ecf0f1; font-weight:700; margin-bottom:8px;">Total: ₹0.00</div>
            <div style="height:220px;">
              <canvas id="recentActivityChart"></canvas>
            </div>
          </div>

          <div class="activity-card">
            <div class="selector-inline">
              <h4 style="margin:0">Monthly Savings</h4>
              <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
                <label for="savingsYear">Year</label>
                <select id="savingsYear" style="padding:6px 8px; border-radius:6px; background:#1e1e1e; color:#ecf0f1; border:1px solid #333;"></select>
              </div>
            </div>
            <div style="height:220px;">
              <canvas id="savingsChart"></canvas>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // default: require login. You can override in frontend/config.js by setting window.__REQUIRE_LOGIN__ = false;
    window.__API_BASE__ = window.__API_BASE__ || '/';
    window.__REMOTE_COUCH__ = window.__REMOTE_COUCH__ || null;
    window.__REQUIRE_LOGIN__ = (typeof window.__REQUIRE_LOGIN__ === 'boolean') ? window.__REQUIRE_LOGIN__ : true;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service worker registered', reg.scope))
          .catch(err => console.warn('Service worker registration failed', err));
      });
    }

    // Collapsible behavior: toggle on click/keyboard, set sensible defaults for mobile/desktop
    (function () {
      function setInitialOpenState(section) {
        // data-default-open attribute controls default; on small screens collapse by default unless explicitly true
        const defaultOpen = section.getAttribute('data-default-open') === 'true';
        const isMobile = window.matchMedia('(max-width: 800px)').matches;
        if (isMobile) {
          // mobile: collapse unless explicitly requested open
          if (defaultOpen) section.classList.add('open');
          else section.classList.remove('open');
        } else {
          // desktop: open if defaultOpen true, otherwise open as well for better UX
          section.classList.add('open');
        }
        updateHeaderState(section);
      }

      function updateHeaderState(section) {
        const header = section.querySelector('.collapsible-header');
        const chev = header.querySelector('.chev');
        const expanded = section.classList.contains('open');
        header.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        if (chev) chev.textContent = expanded ? '▲' : '▼';
      }

      function toggleSection(section) {
        section.classList.toggle('open');
        updateHeaderState(section);
      }

      document.addEventListener('DOMContentLoaded', () => {
        const sections = document.querySelectorAll('.collapsible');
        sections.forEach(section => {
          setInitialOpenState(section);
          const header = section.querySelector('.collapsible-header');
          if (!header) return;
          header.addEventListener('click', () => toggleSection(section));
          header.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter' || ev.key === ' ') {
              ev.preventDefault();
              toggleSection(section);
            }
          });
        });

        // Keep collapsible behavior responsive on resize
        let resizeTimer = null;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            document.querySelectorAll('.collapsible').forEach(setInitialOpenState);
          }, 200);
        });
      });
    })();
  </script>

  <!-- Core libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Shared DB + app logic -->
  <script src="frontend/config.js" defer></script>
  <script src="frontend/db.js" defer></script>
  <script src="frontend/charts.js" defer></script>
  <script type="module" src="frontend/app.js" defer></script>
</body>
</html>
