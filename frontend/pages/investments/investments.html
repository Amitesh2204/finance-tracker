<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Investments</title>
  <!-- Adjusted paths: style.css and app.js are one level up from /pages/investments -->
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="investments.css">

  <!-- Explicit Cloudflare tunnel overrides -->
  <script>
    window.__API_BASE__ = 'https://southampton-nutten-renewable-citizen.trycloudflare.com/';
  </script>

  <script src="https://unpkg.com/pouchdb@7.3.1/dist/pouchdb.min.js"></script>
  <script src="../../app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="investments.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><h1>Wealty</h1></div>
      <nav>
        <a href="../budget.html">Budget</a>
        <a href="../expense.html">Expense</a>
        <a href="investments.html" class="active">Investments</a>
        <a href="../report.html">Report</a>
      </nav>
      <div class="sidebar-footer">
        <a href="../settings.html">⚙️ Settings</a>
        <a href="../login.html">🚪 Logout</a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar"><h2>Investments</h2></header>
      <section class="content">
        <!-- Summary cards -->
        <div class="cards">
          <div class="card mutualfund"><h3>Mutual Fund</h3><p id="mutualFundTotal">$0.00</p></div>
          <div class="card lic"><h3>LIC</h3><p id="licTotal">$0.00</p></div>
          <div class="card ppf"><h3>PPF</h3><p id="ppfTotal">$0.00</p></div>
          <div class="card sukanya"><h3>Sukanya Yojana</h3><p id="sukanyaTotal">$0.00</p></div>
        </div>

        <!-- Add Investment form -->
        <div class="card">
          <h3>Add Investment</h3>
          <form id="investmentForm" class="investment-form">
            <label for="investmentType">Investment type</label>
            <select id="investmentType" required>
              <option value="Mutual Fund">Mutual Fund</option>
              <option value="LIC">LIC</option>
              <option value="PPF">PPF</option>
              <option value="Sukanya Yojana">Sukanya Yojana</option>
            </select>

            <label for="investmentAmount">Amount</label>
            <input id="investmentAmount" type="number" min="0" step="0.01" placeholder="Enter amount" required />

            <button type="submit">Add Investment</button>
          </form>
        </div>

        <!-- Investment Growth chart -->
        <div class="chart card same-size">
          <h3>Investment Growth</h3>
          <canvas id="investmentGrowthChart"></canvas>
        </div>

        <!-- Saved Investments table -->
        <div class="card">
          <h3>Saved Investments</h3>
          <table id="investmentsTable" class="investment-table">
            <thead><tr><th>Type</th><th>Amount</th><th>Date</th></tr></thead>
            <tbody><tr><td colspan="3">Loading investments...</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
