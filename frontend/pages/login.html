<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Finance Tracker</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    :root {
      --bg-gradient-start: #0b2824;
      --bg-gradient-mid: #12483f;
      --bg-gradient-end: #173b57;
      --card-bg: rgba(14, 31, 29, .88);
      --accent: #52d3a5;
      --muted: #a9bbb5;
      --danger: #ff8b80;
    }

    html,body {
      height:100%;
      margin:0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background:
        radial-gradient(circle at 15% 15%, rgba(82,211,165,.2), transparent 28rem),
        radial-gradient(circle at 90% 85%, rgba(83,158,222,.18), transparent 26rem),
        linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-mid), var(--bg-gradient-end));
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      color:#ecf0f1;
    }

    .center-wrap {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .login-wrap {
      width:100%;
      max-width:460px;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      border-radius:20px;
      padding:clamp(24px, 5vw, 36px);
      box-shadow: 0 24px 64px rgba(0,0,0,.34);
      border: 1px solid rgba(255,255,255,.12);
      overflow:hidden;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:18px;
    }
    .brand .logo {
      width:46px; height:46px; border-radius:14px;
      background: linear-gradient(135deg,var(--accent),#67aee6);
      display:flex; align-items:center; justify-content:center; font-weight:800; color:#09342b;
      box-shadow: 0 8px 20px rgba(0,0,0,.26);
    }
    .brand h1 { margin:0; font-size:1.2rem; letter-spacing:0.2px; color:#ecf0f1; }

    h3 {
      margin:0 0 12px 0;
      font-size:1.1rem;
      color:#ecf0f1;
      text-align:left;
    }

    .form-row { margin-bottom:12px; }
    label {
      display:block;
      font-size:0.85rem;
      color:var(--muted);
      margin-bottom:6px;
      font-weight:600;
    }

    input[type="text"], input[type="password"], input[type="email"] {
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.18);
      color:#ecf0f1;
      font-size:0.95rem;
      transition: box-shadow .18s, border-color .18s;
    }
    input::placeholder { color: rgba(255,255,255,0.35); }

    input:focus {
      outline:none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(82,211,165,.14);
    }

    .login-actions {
      display:flex;
      gap:10px;
      margin-top:6px;
    }

    .btn {
      flex:1;
      padding:11px 14px;
      border-radius:12px;
      border:0;
      cursor:pointer;
      font-weight:700;
      font-size:0.95rem;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .btn:active { transform: translateY(1px); }

    .btn-primary {
      background: linear-gradient(90deg,var(--accent),#35b889);
      color:#09342b;
      box-shadow: 0 8px 20px rgba(82,211,165,.18);
    }
    .btn-secondary {
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
    }
    .btn-muted {
      background:rgba(255,255,255,.12);
      color:#ecf0f1;
    }

    .small {
      font-size:0.9rem;
      color:var(--muted);
      margin-top:10px;
      text-align:center;
    }

    .oauth-note {
      color:var(--muted);
      font-size:0.85rem;
      margin-top:12px;
      text-align:center;
    }

    .error {
      color:var(--danger);
      font-size:0.9rem;
      margin-bottom:8px;
      display:none;
    }

    #registerBox {
      margin-top:18px;
      display:none;
    }

    @media (max-width:520px) {
      .center-wrap { padding:16px; }
      .login-wrap { padding:22px 18px; border-radius:16px; }
      .brand h1 { font-size:1rem; }
      .login-actions { flex-direction:column; }
      .btn { width:100%; min-height:44px; }
    }
  </style>
  <script src="https://unpkg.com/pouchdb@7.3.1/dist/pouchdb.min.js"></script>
  <script src="../config.js"></script>
</head>
<body>
  <div class="center-wrap">
    <div class="login-wrap" role="main" aria-labelledby="loginTitle">
      <div class="brand" aria-hidden="true">
        <div class="logo">W</div>
        <h1>Wealty — Finance Tracker</h1>
      </div>

      <!-- Login Box -->
      <div id="loginBox" aria-live="polite">
        <h3 id="loginTitle">Sign in to Wealty</h3>
        <div id="error" class="error" role="alert"></div>

        <div class="form-row">
          <label for="username">Username or Email</label>
          <input id="username" type="text" autocomplete="username" placeholder="username or email" />
        </div>

        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="password" />
        </div>

        <div class="login-actions" role="group" aria-label="Login actions">
          <button id="loginBtn" class="btn btn-primary">Login</button>
          <button id="toRegister" class="btn btn-secondary">Register</button>
        </div>

        <div class="oauth-note">Google sign-in is not enabled by default. Configure OAuth in <code>config.js</code> to enable.</div>
      </div>

      <!-- Register Box -->
      <div id="registerBox" aria-live="polite">
        <h3>Create an account</h3>
        <div id="regError" class="error" role="alert"></div>

        <div class="form-row">
          <label for="regUsername">Username</label>
          <input id="regUsername" type="text" autocomplete="username" placeholder="username" />
        </div>

        <div class="form-row">
          <label for="regEmail">Email (optional)</label>
          <input id="regEmail" type="email" autocomplete="email" placeholder="you@example.com" />
        </div>

        <div class="form-row">
          <label for="regPassword">Password</label>
          <input id="regPassword" type="password" autocomplete="new-password" placeholder="password" />
        </div>

        <div class="login-actions" role="group" aria-label="Register actions">
          <button id="registerBtn" class="btn btn-primary">Create account</button>
          <button id="toLogin" class="btn btn-muted">Back to login</button>
        </div>

        <div class="small">By creating an account you agree to store credentials locally. For Google sign-in, enable OAuth on the server.</div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      // Utility: show/hide error
      function showError(id, msg) {
        const el = document.getElementById(id);
        if (!el) return;
        if (msg) {
          el.style.display = 'block';
          el.textContent = msg;
        } else {
          el.style.display = 'none';
          el.textContent = '';
        }
      }

      // Elements
      const loginBtn = document.getElementById('loginBtn');
      const toRegister = document.getElementById('toRegister');
      const registerBtn = document.getElementById('registerBtn');
      const toLogin = document.getElementById('toLogin');

      const loginBox = document.getElementById('loginBox');
      const registerBox = document.getElementById('registerBox');

      // Toggle views
      toRegister.addEventListener('click', () => {
        showError('error', '');
        showError('regError', '');
        loginBox.style.display = 'none';
        registerBox.style.display = 'block';
        document.getElementById('regUsername').focus();
      });

      toLogin.addEventListener('click', () => {
        showError('error', '');
        showError('regError', '');
        registerBox.style.display = 'none';
        loginBox.style.display = 'block';
        document.getElementById('username').focus();
      });

      // Legacy hash retained only for existing users during migration.
      function fallbackHash(s) {
        let h = 2166136261 >>> 0;
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return (h >>> 0).toString(16);
      }

      function bytesToBase64(bytes) {
        let binary = '';
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return btoa(binary);
      }

      function base64ToBytes(value) {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      async function securePasswordHash(password, saltBytes) {
        if (!window.crypto?.subtle) {
          throw new Error('Secure password hashing is unavailable in this browser.');
        }

        const salt = saltBytes || crypto.getRandomValues(new Uint8Array(16));
        const material = await window.crypto.subtle.importKey(
          'raw',
          new TextEncoder().encode(password),
          'PBKDF2',
          false,
          ['deriveBits']
        );

        const bits = await window.crypto.subtle.deriveBits(
          {
            name: 'PBKDF2',
            salt,
            iterations: 150000,
            hash: 'SHA-256'
          },
          material,
          256
        );

        return {
          algorithm: 'PBKDF2-SHA-256',
          iterations: 150000,
          salt: bytesToBase64(salt),
          hash: bytesToBase64(new Uint8Array(bits))
        };
      }

      function constantTimeEqual(a, b) {
        if (typeof a !== 'string' || typeof b !== 'string') return false;

        let diff = a.length ^ b.length;
        const length = Math.max(a.length, b.length);

        for (let i = 0; i < length; i++) {
          diff |= (a.charCodeAt(i) || 0) ^ (b.charCodeAt(i) || 0);
        }

        return diff === 0;
      }

      async function verifyPassword(doc, password) {
        if (doc.passwordHashV2?.hash && doc.passwordHashV2?.salt) {
          const result = await securePasswordHash(
            password,
            base64ToBytes(doc.passwordHashV2.salt)
          );
          return constantTimeEqual(result.hash, doc.passwordHashV2.hash);
        }

        return doc.passwordHash === fallbackHash(password);
      }

      // Login handler
      loginBtn.addEventListener('click', async () => {
        showError('error', '');
        const username = (document.getElementById('username').value || '').trim();
        const password = document.getElementById('password').value || '';
        if (!username || !password) {
          showError('error', 'Please enter username/email and password.');
          return;
        }

        try {
          // Prefer app-provided loginUser if available
          if (window.loginUser && typeof window.loginUser === 'function') {
            await window.loginUser({ usernameOrEmail: username, password });
          } else {
            // Fallback: use local users DB directly
            const usersDb = new PouchDB('finance-users');
            let doc = null;
            try {
              doc = await usersDb.get('user:' + username.toLowerCase());
            } catch (e) {
              // not found by id
            }
            if (!doc) {
              // scan by email
              try {
                const all = await usersDb.allDocs({ include_docs: true });
                doc = all.rows.map(r => r.doc).find(d => d.email === username) || null;
              } catch (e) {
                // ignore
              }
            }
            if (!doc) throw new Error('User not found');
            const validPassword = await verifyPassword(doc, password);
            if (!validPassword) throw new Error('Invalid credentials');

            if (!doc.passwordHashV2) {
              doc.passwordHashV2 = await securePasswordHash(password);
              delete doc.passwordHash;
              await usersDb.put(doc);
            }

            const user = { username: doc.username, email: doc.email, id: doc._id };
            sessionStorage.setItem('finance-tracker:current-user', JSON.stringify(user));
            window.__CURRENT_USER__ = user;
          }

          // Redirect to home (preserve origin)
          const base = (window.location.pathname || '').replace(/\/[^/]*$/, '/../../').replace(/\/\/+/g, '/');
          // Simpler redirect to root index
          const path = window.location.pathname || '/';
          const appRoot = window.__APP_BASE_PATH__ || (path.includes('/frontend/') ? path.split('/frontend/')[0] + '/' : '/');
          window.location.href = `${appRoot}index.html`;
        } catch (err) {
          showError('error', err && err.message ? err.message : 'Login failed');
        }
      });

      // Register handler
      registerBtn.addEventListener('click', async () => {
        showError('regError', '');
        const username = (document.getElementById('regUsername').value || '').trim();
        const email = (document.getElementById('regEmail').value || '').trim();
        const password = document.getElementById('regPassword').value || '';
        if (!username || !password) {
          showError('regError', 'Please enter username and password.');
          return;
        }
        if (password.length < 8) {
          showError('regError', 'Password must be at least 8 characters.');
          return;
        }

        try {
          if (window.registerUser && typeof window.registerUser === 'function') {
            await window.registerUser({ username, email, password });
          } else {
            const usersDb = new PouchDB('finance-users');
            const id = 'user:' + username.toLowerCase();
            const existing = await usersDb.get(id).catch(() => null);
            if (existing) throw new Error('User already exists');
            const passwordHashV2 = await securePasswordHash(password);
            await usersDb.put({
              _id: id,
              username,
              email: email || '',
              passwordHashV2,
              createdAt: new Date().toISOString()
            });
          }

          // Success feedback and switch to login
          alert('Account created successfully. You can now sign in.');
          registerBox.style.display = 'none';
          loginBox.style.display = 'block';
          document.getElementById('username').value = username;
          document.getElementById('password').value = '';
          document.getElementById('username').focus();
        } catch (err) {
          showError('regError', err && err.message ? err.message : 'Registration failed');
        }
      });
      // If already logged in, redirect to home
      try {
        const cur = (window.getCurrentUser && typeof window.getCurrentUser === 'function') ? window.getCurrentUser() : JSON.parse(sessionStorage.getItem('finance-tracker:current-user') || 'null');
        if (cur) {
          const path = window.location.pathname || '/';
          const appRoot = window.__APP_BASE_PATH__ || (path.includes('/frontend/') ? path.split('/frontend/')[0] + '/' : '/');
          window.location.href = `${appRoot}index.html`;
        }
      } catch (e) {
        // ignore parse errors
      }

      // Accessibility: allow Enter key to submit on login form
      document.getElementById('password').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') loginBtn.click();
      });
      document.getElementById('regPassword').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') registerBtn.click();
      });
    })();
  </script>
</body>
</html>
